name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          
      - name: Restore
        run: dotnet restore ProxyForge.sln
        
      - name: Build
        run: dotnet build ProxyForge.sln -c Release --no-restore
        
      - name: Pack
        run: |
          if (!(Test-Path ./nupkg)) { New-Item -ItemType Directory -Path ./nupkg | Out-Null }
          dotnet pack src/ProxyForge.Core/ProxyForge.Core.csproj -c Release -o ./nupkg
          dotnet pack src/ProxyForge.WinForms/ProxyForge.WinForms.csproj -c Release -o ./nupkg
          
      - name: List packages
        run: dir ./nupkg
        
      - name: Push to NuGet
        run: |
          Get-ChildItem ./nupkg/*.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name)"
            dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
