name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          
      - name: Restore
        run: dotnet restore ProxyForge.sln
        
      - name: Pack Core
        run: dotnet pack src/ProxyForge.Core/ProxyForge.Core.csproj -c Release -o ./nupkg
        
      - name: Pack WinForms
        run: dotnet pack src/ProxyForge.WinForms/ProxyForge.WinForms.csproj -c Release -o ./nupkg
        
      - name: Pack Extensions
        run: dotnet pack src/ProxyForge.Extensions/ProxyForge.Extensions.csproj -c Release -o ./nupkg --no-build || echo "skip extensions"
        
      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
